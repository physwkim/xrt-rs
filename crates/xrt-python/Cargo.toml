[package]
name = "xrt-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for xrt-rs"
# A pyo3 extension-module cdylib exports no Rust API and cannot be linked as a
# dependency; it reaches users as the xrt-rs wheel that maturin builds.
publish = false

[lib]
name = "xrt_rs"
crate-type = ["cdylib"]

[dependencies]
xrt-core = { workspace = true }
xrt-math = { workspace = true }
xrt-materials = { workspace = true }
xrt-oes = { workspace = true }
xrt-sources = { workspace = true }
xrt-waves = { workspace = true }
xrt-pytte = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
thiserror = { workspace = true }
pyo3 = { workspace = true }
numpy = { workspace = true }
