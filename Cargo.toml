[package]
name = "xrt-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/physwkim/xrt-rs"
readme = "README.md"
description = "Ray tracing and wave propagation in the x-ray regime: synchrotron sources, optical elements, materials and diffraction"
keywords = ["x-ray", "synchrotron", "raytracing", "optics", "physics"]
categories = ["science", "simulation"]

[features]
# The GPU kernels pull in wgpu, a dependency tree a CPU-only consumer never
# needs; build_i_map_auto and kirchhoff_auto stay on their f64 CPU paths when
# the feature is off.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
ndarray = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
npyz = { workspace = true }
zip = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "transforms"
harness = false

[[bench]]
name = "crystal"
harness = false

[[bench]]
name = "intersection"
harness = false

[[bench]]
name = "sources"
harness = false

[[bench]]
name = "diffraction"
harness = false

[workspace]
members = ["crates/xrt-python"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/physwkim/xrt-rs"

[workspace.dependencies]
# Core numeric
ndarray = "0.16"
num-complex = "0.4"
num-traits = "0.2"

# Parallelism
rayon = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# GPU
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# Data loading
npyz = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = { version = "0.23", package = "numpy" }

# Testing
approx = "0.5"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# The library itself, for the members that wrap it.
xrt-rs = { path = ".", version = "0.2.0" }
