[workspace]
members = [
    "crates/xrt-core",
    "crates/xrt-math",
    "crates/xrt-materials",
    "crates/xrt-oes",
    "crates/xrt-sources",
    "crates/xrt-waves",
    "crates/xrt-pytte",
    "crates/xrt-gpu",
    "crates/xrt-python",
    "examples",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/physwkim/xrt-rs"

[workspace.dependencies]
# Core numeric
ndarray = "0.16"
num-complex = "0.4"
num-traits = "0.2"

# Parallelism
rayon = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# GPU
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# Data loading
npyz = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = { version = "0.23", package = "numpy" }

# Testing
approx = "0.5"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates. The version is what a published crate depends on; cargo
# drops the path when packaging and refuses to publish without it.
xrt-core = { path = "crates/xrt-core", version = "0.2.0" }
xrt-math = { path = "crates/xrt-math", version = "0.2.0" }
xrt-materials = { path = "crates/xrt-materials", version = "0.2.0" }
xrt-oes = { path = "crates/xrt-oes", version = "0.2.0" }
xrt-sources = { path = "crates/xrt-sources", version = "0.2.0" }
xrt-waves = { path = "crates/xrt-waves", version = "0.2.0" }
xrt-pytte = { path = "crates/xrt-pytte", version = "0.2.0" }
xrt-gpu = { path = "crates/xrt-gpu", version = "0.2.0" }
